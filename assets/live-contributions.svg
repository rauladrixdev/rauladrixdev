<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="164" viewBox="0 0 1200 164" role="img" aria-label="Open Raul Adriano's live contribution calendar on GitHub. This link does not display fabricated contribution counts.">
<defs><linearGradient id="abg" x2="1" y2="1"><stop stop-color="#0A1426"/><stop offset="1" stop-color="#143454"/></linearGradient><linearGradient id="line" x2="0" y2="1"><stop stop-color="#38BDF8"/><stop offset="1" stop-color="#2563EB"/></linearGradient></defs>
<style>
@keyframes slide{0%,100%{opacity:.3;transform:translateX(0)}50%{opacity:.7;transform:translateX(10px)}}
.moving{animation:slide 5s ease-in-out infinite}
