</style>
<rect x="2" y="2" width="1196" height="160" rx="18" fill="url(#abg)" stroke="#2D5576" stroke-width="2"/>
<path d="M26 35H26V130" stroke="url(#line)" stroke-width="6" stroke-linecap="round"/>
